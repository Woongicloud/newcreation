<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f7f4"/>
      <stop offset="100%" stop-color="#eef4ee"/>
    </linearGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd08a"/>
      <stop offset="100%" stop-color="#6fbf73"/>
    </linearGradient>
    <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#74c47b"/>
      <stop offset="100%" stop-color="#54ab63"/>
    </linearGradient>
    <linearGradient id="hillC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5cb267"/>
      <stop offset="100%" stop-color="#3f9a55"/>
    </linearGradient>
    <!-- 바람개비 1개 정의 (4색 파스텔 날개) -->
    <g id="pinwheel">
      <g>
        <path d="M0,0 L-46,-30 A54,54 0 0 1 0,-54 Z" fill="#f7b8cf"/>
        <path d="M0,0 L30,-46 A54,54 0 0 1 54,0 Z" fill="#ffe39a"/>
        <path d="M0,0 L46,30 A54,54 0 0 1 0,54 Z" fill="#a9d6f0"/>
        <path d="M0,0 L-30,46 A54,54 0 0 1 -54,0 Z" fill="#c3e8b8"/>
      </g>
      <circle r="8" fill="#fff" stroke="#e6c84d" stroke-width="3"/>
    </g>
    <g id="cloud" fill="#ffffff">
      <ellipse cx="0" cy="0" rx="60" ry="34"/>
      <ellipse cx="46" cy="8" rx="44" ry="26"/>
      <ellipse cx="-46" cy="8" rx="44" ry="26"/>
    </g>
  </defs>

  <!-- 하늘 -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- 구름 -->
  <use href="#cloud" x="360" y="150" opacity="0.85"/>
  <use href="#cloud" x="1180" y="120" opacity="0.8" transform="scale(1.2)" transform-origin="1180 120"/>
  <use href="#cloud" x="780" y="220" opacity="0.7"/>

  <!-- 새 / 나비 (간단한 선) -->
  <path d="M300 300 q14 -16 28 0 q14 -16 28 0" fill="none" stroke="#9aa0a6" stroke-width="4" stroke-linecap="round"/>
  <path d="M470 270 q12 -14 24 0 q12 -14 24 0" fill="none" stroke="#b7bcc2" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="640" cy="360" r="7" fill="#cfe9bd"/>
  <circle cx="1230" cy="330" r="6" fill="#f7c7da"/>

  <!-- 잔디 언덕 -->
  <path d="M0,640 C320,560 560,600 800,650 C1060,700 1320,640 1600,600 L1600,900 L0,900 Z" fill="url(#hillA)"/>
  <path d="M0,720 C300,660 620,720 900,710 C1180,700 1420,740 1600,700 L1600,900 L0,900 Z" fill="url(#hillB)"/>
  <path d="M0,800 C360,760 700,820 1020,800 C1300,784 1460,820 1600,800 L1600,900 L0,900 Z" fill="url(#hillC)"/>

  <!-- 바람개비들 (줄기 + 머리) -->
  <g stroke-linecap="round">
    <!-- 왼쪽 큰 것 -->
    <line x1="150" y1="900" x2="150" y2="612" stroke="#caa46a" stroke-width="9"/>
    <use href="#pinwheel" transform="translate(150 600) scale(1.25)"/>

    <line x1="330" y1="900" x2="330" y2="676" stroke="#caa46a" stroke-width="8"/>
    <use href="#pinwheel" transform="translate(330 668) scale(1.0)"/>

    <line x1="520" y1="900" x2="520" y2="712" stroke="#caa46a" stroke-width="7"/>
    <use href="#pinwheel" transform="translate(520 706) scale(0.85) rotate(20)"/>

    <line x1="700" y1="900" x2="700" y2="748" stroke="#caa46a" stroke-width="6"/>
    <use href="#pinwheel" transform="translate(700 742) scale(0.7) rotate(-15)"/>

    <!-- 오른쪽 무리 -->
    <line x1="980" y1="900" x2="980" y2="724" stroke="#caa46a" stroke-width="7"/>
    <use href="#pinwheel" transform="translate(980 718) scale(0.9) rotate(10)"/>

    <line x1="1160" y1="900" x2="1160" y2="684" stroke="#caa46a" stroke-width="8"/>
    <use href="#pinwheel" transform="translate(1160 676) scale(1.05)"/>

    <line x1="1360" y1="900" x2="1360" y2="624" stroke="#caa46a" stroke-width="9"/>
    <use href="#pinwheel" transform="translate(1360 612) scale(1.3) rotate(-10)"/>

    <line x1="1520" y1="900" x2="1520" y2="712" stroke="#caa46a" stroke-width="7"/>
    <use href="#pinwheel" transform="translate(1520 706) scale(0.85) rotate(25)"/>
  </g>
</svg>
